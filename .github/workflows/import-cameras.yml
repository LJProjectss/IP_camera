name: Cameralijst bijwerken

on:
  schedule:
    - cron: '0 4 * * *' # dagelijks om 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-cameras.mjs
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
      - name: Wijzigingen committen
        run: |
          if git diff --quiet public/cameras.json; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cameras.json
          git commit -m "Cameralijst bijgewerkt"
          git push
